name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # ──────────────────────────────────────────────
  # Backend .NET
  # ──────────────────────────────────────────────
  backend:
    name: Backend (.NET 9)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/CasalPlanner.API

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (treat warnings as errors for new code)
        run: dotnet build --no-restore --configuration Release

      # Quando os testes xUnit forem criados, descomentar:
      # - name: Run tests
      #   run: dotnet test --no-build --configuration Release --verbosity normal
      #   working-directory: backend

  # ──────────────────────────────────────────────
  # Frontend Vite + TypeScript
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend (Node / Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc)
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # Quando os testes Vitest forem criados, descomentar:
      # - name: Run tests
      #   run: npm test -- --run
