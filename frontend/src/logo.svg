<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Pure Spreadsheet Symbol (Icon Only) -->
  <g>
    <!-- Squircle Background -->
    <rect width="120" height="120" rx="32" fill="#8B5CF6"/>
    
    <!-- Spreadsheet Grid -->
    <rect x="25" y="25" width="70" height="70" rx="10" fill="white"/>
    
    <!-- Spreadsheet Header -->
    <path d="M25 35 a10 10 0 0 1 10 -10 h50 a10 10 0 0 1 10 10 v15 h-70 z" fill="#7C3AED"/>
    
    <!-- Spreadsheet Cells (Simulated) -->
    <line x1="30" y1="65" x2="90" y2="65" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
    <line x1="30" y1="80" x2="90" y2="80" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
    <line x1="50" y1="50" x2="50" y2="90" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
    
    <!-- Accent Cell -->
    <rect x="55" y="60" width="30" height="10" rx="2" fill="#8B5CF6" opacity="0.4"/>
  </g>
</svg>