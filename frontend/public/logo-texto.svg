    <path d="M95 10 V5 H98.5 V12" stroke="#2F7D5B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M48 14 L82 5 L116 14" stroke="#2F7D5B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M82 7.2 C81 6.2 79.5 6.2 79.5 7.4 C79.5 8.6 82 10 82 10 C82 10 84.5 8.6 84.5 7.4 C84.5 6.2 83 6.2 82 7.2 Z" fill="#E0531C"/>
