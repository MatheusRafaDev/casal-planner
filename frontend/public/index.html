<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />

    <!-- ===== VIEWPORT: viewport-fit=cover é ESSENCIAL para safe areas no iPhone ===== -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- ===== PWA / iOS ===== -->
    <!-- Permite adicionar à tela inicial como app -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Barra de status translúcida (respeita a cor do header via theme-color) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CasalPlanner" />

    <!-- theme-color: cor da barra de endereço no Safari/Chrome mobile -->
    <meta name="theme-color" content="#8B5CF6" />

    <!-- ===== Favicons ===== -->
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/logo.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />

    <!-- ===== PWA manifest ===== -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <meta name="description" content="CasalPlanner — Organize as compras e finanças do casal em um só lugar." />

    <title>CasalPlanner</title>
  </head>
  <body style="background-color: #18181B; color: #F4F4F5;">
    <noscript>Você precisa habilitar o JavaScript para usar o CasalPlanner.</noscript>
    <div id="root"></div>
  </body>
</html>
