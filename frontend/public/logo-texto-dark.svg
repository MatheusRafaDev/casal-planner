<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&amp;display=swap');
      .brand-title-dark {
        font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 27px;
        letter-spacing: -0.03em;
      }
    </style>
  </defs>

  <!-- Símbolo Oficial CasalPlanner (Dark) -->
  <g transform="translate(4, 4) scale(0.833)">
    <!-- Telhado com Beiral (Verde Esmeralda e Dourado) -->
    <path d="M 7 21.5 L 24 7.5" stroke="#4FB387" stroke-width="4.2" stroke-linecap="round" />
    <path d="M 41 21.5 L 24 7.5" stroke="#F5B938" stroke-width="4.2" stroke-linecap="round" />

    <!-- Estrutura do Lar e Fundação -->
    <path d="M 12 23.5 V 37.5 C 12 39.5 13.5 40.5 15.5 40.5 H 32.5 C 34.5 40.5 36 39.5 36 37.5 V 23.5"
          stroke="#FAF6EE" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="9" y1="41" x2="39" y2="41" stroke="#FAF6EE" stroke-width="3" stroke-linecap="round" />

    <!-- Coração Duo Central -->
    <path d="M 24 18 C 22 14.5 16.5 15 15 19.8 C 13.5 25.5 24 33.5 24 33.5 C 24 33.5 34.5 25.5 33 19.8 C 31.5 15 26 14.5 24 18 Z"
          fill="#141A17" stroke="#FAF6EE" stroke-width="2" stroke-linejoin="round" />
    <path d="M 24 18 C 22 14.5 16.5 15 15 19.8 C 13.5 25.5 24 33.5 24 33.5 V 18 Z" fill="#4FB387" />
    <path d="M 24 18 C 26 14.5 31.5 15 33 19.8 C 34.5 25.5 24 33.5 24 33.5 V 18 Z" fill="#F5B938" />
  </g>

  <!-- Tipografia Moderna Outfit (Dark) -->
  <text x="50" y="32" class="brand-title-dark">
    <tspan fill="#4FB387">Casal</tspan><tspan fill="#FAF6EE">Planner</tspan>
  </text>

  <!-- Ponto Solar Dourado -->
  <circle cx="210" cy="27" r="3.2" fill="#F5B938" />
</svg>
