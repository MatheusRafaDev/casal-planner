<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA"/>
      <stop offset="100%" style="stop-color:#F9A8D4"/>
    </linearGradient>
    <linearGradient id="heart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f0e6ff;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>

  <!-- House shape -->
  <path d="M32 12 L52 30 L49 30 L49 52 L15 52 L15 30 L12 30 Z"
        fill="white" fill-opacity="0.2"/>

  <!-- House roof line only -->
  <path d="M32 13 L50 29.5" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M32 13 L14 29.5" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Heart in center of house -->
  <path d="M32 42
           C32 42 21 34.5 21 28.5
           C21 24.5 24.5 22 28 24
           C29.5 24.8 31 26.2 32 27.5
           C33 26.2 34.5 24.8 36 24
           C39.5 22 43 24.5 43 28.5
           C43 34.5 32 42 32 42 Z"
        fill="url(#heart)" opacity="0.95"/>

  <!-- Subtle door -->
  <rect x="27.5" y="43" width="9" height="9" rx="4.5" fill="white" opacity="0.3"/>
</svg>
