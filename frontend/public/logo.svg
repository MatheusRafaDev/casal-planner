<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 48" fill="none" width="260" height="48">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&amp;display=swap');
      .brand-text {
        font-family: 'Fredoka', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 26px;
        fill: #24302A;
        letter-spacing: -0.02em;
      }
    </style>
  </defs>

  <!-- Brand Symbol (House sheltering Green & Yellow couple) -->
  <svg x="4" y="2" width="44" height="44" viewBox="0 0 48 48" fill="none">
    <!-- House base -->
    <path
      d="M7 19 L24 5 L41 19 V41 C41 42.6569 39.6569 44 38 44 H10 C8.34315 44 7 42.6569 7 41 Z"
      fill="#FFFDF8"
      stroke="#24302A"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- Roof gable -->
    <path
      d="M24 7 L39 19 H9 Z"
      fill="#E8B63C"
    />
    <path
      d="M4 20 L24 4 L44 20"
      stroke="#24302A"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Heart at gable -->
    <path
      d="M24 12 C23 10.5 20.8 10.5 20.8 12.2 C20.8 14 24 16 24 16 C24 16 27.2 14 27.2 12.2 C27.2 10.5 25 10.5 24 12 Z"
      fill="#E0531C"
      stroke="#24302A"
      stroke-width="1.2"
      stroke-linejoin="round"
    />

    <!-- Boneco Verde (Pessoa 1) -->
    <g id="boneco-verde">
      <circle
        cx="17"
        cy="24"
        r="4.2"
        fill="#2F7D5B"
        stroke="#24302A"
        stroke-width="2"
      />
      <path
        d="M11 44 C11 35 13.5 30.5 17 30.5 C20.5 30.5 23 35 23 44 Z"
        fill="#2F7D5B"
        stroke="#24302A"
        stroke-width="2"
        stroke-linejoin="round"
      />
    </g>

    <!-- Boneco Amarelo (Pessoa 2) -->
    <g id="boneco-amarelo">
      <circle
        cx="31"
        cy="24"
        r="4.2"
        fill="#E8B63C"
        stroke="#24302A"
        stroke-width="2"
      />
      <path
        d="M25 44 C25 35 27.5 30.5 31 30.5 C34.5 30.5 37 35 37 44 Z"
        fill="#E8B63C"
        stroke="#24302A"
        stroke-width="2"
        stroke-linejoin="round"
      />
    </g>
  </svg>

  <!-- Telhado de Casa sobre 'Casal' -->
  <g id="telhado-casal">
    <path d="M103 10 V5 H106.5 V12" stroke="#2F7D5B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M56 14 L90 5 L124 14" stroke="#2F7D5B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M90 7.2 C89 6.2 87.5 6.2 87.5 7.4 C87.5 8.6 90 10 90 10 C90 10 92.5 8.6 92.5 7.4 C92.5 6.2 91 6.2 90 7.2 Z" fill="#E0531C"/>
  </g>

  <!-- Brand Typography -->
  <text x="56" y="34" class="brand-text">
    <tspan fill="#2F7D5B">Casal</tspan><tspan fill="#24302A">Planner</tspan>
  </text>

  <!-- Selo de Checkmark no 'Planner' -->
  <g transform="translate(212, 17)">
    <rect x="0" y="0" width="18" height="18" rx="5" fill="#2F7D5B" stroke="#24302A" stroke-width="1.5"/>
    <path d="M4.5 9.5 L7.5 12.5 L13.5 5.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sublinhado Marker sob "Planner" -->
  <path d="M128 39 Q 168 42, 210 39" stroke="#E8B63C" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
</svg>
